; ============================================================
; MONITOR DE QUEDAS DE ENERGIA — ESP32
; ============================================================
; Duas firmwares que compartilham o mesmo nucleo (src/monitor_core.*):
;
;   opcao 1 (substitui o ESP-01):
;     pio run -e gateway_uart -t upload
;
;   opcao 2 (placa unica: Arduino + gateway num so chip):
;     pio run -e unificado_adc -t upload
;
; Monitor serial (115200):
;   pio device monitor
; ============================================================

[env]
platform = espressif32@^6.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    knolleary/PubSubClient@^2.8

[env:gateway_uart]
build_src_filter = +<*> -<main_adc.cpp>
build_flags = -DFUNCAO_UART

[env:unificado_adc]
build_src_filter = +<*> -<main_uart.cpp>
build_flags = -DFUNCAO_ADC
