[env:uno]
platform = atmelavr
board = uno
framework = arduino
upload_speed = 115200
monitor_speed = 9600
build_src_filter = +<main.cpp> +<ds1302.cpp>

; V1 original (commit inicial): detector de rua pelo ZMPT no A0,
; amplitude pico-a-pico, limiar 65. Extrato do commit f25d402,
; sem alteracao — e o firmware da primeira versao em campo.
[env:v1]
platform = atmelavr
board = uno
framework = arduino
upload_speed = 115200
monitor_speed = 9600
build_src_filter = +<main_v1.cpp>

; Sonda do ZMPT: a rua chega pelo sensor AC? (ver main_zmpt_teste.cpp)
[env:zmpt_teste]
platform = atmelavr
board = uno
framework = arduino
upload_speed = 115200
monitor_speed = 9600
build_src_filter = +<main_zmpt_teste.cpp>

; Sonda temporaria: teste de ligacao do DS1302 (ver main_rtc_teste.cpp)
